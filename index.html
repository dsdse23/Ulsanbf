```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>울산사업팀 조식비 제출</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    position:relative;
}

h1,h2{
    text-align:center;
}

.lock-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    font-size:16px;
    opacity:0.6;
    cursor:pointer;
}

.lock-btn:hover{
    opacity:1;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn-secondary{
    background:#6c757d;
}

.btn-danger{
    background:#dc3545;
}

.entry{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

img{
    max-width:200px;
    margin-top:10px;
    border-radius:6px;
}

.pdf-placeholder{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    background:#e9ecef;
    border-radius:6px;
    font-size:14px;
    color:#495057;
    border:1px dashed #ced4da;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
}

.admin-status{
    color:green;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.deadline-box{
    margin-top:10px;
}

.deadline-on{
    background:red;
    color:white;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.capacity{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<button class="lock-btn" onclick="toggleAdminByLock()">🔒</button>

<h1>울산사업팀 조식비 제출</h1>

<div id="submitArea">
    <input type="text" id="name" placeholder="이름 입력">
    <input type="text" id="amount" placeholder="금액 입력">
    <input type="file" id="receipt" accept="image/*,.pdf">
    <button onclick="submitData()">제출하기</button>
</div>

<div id="deadlineStatus" class="deadline-box"></div>

<div class="capacity" id="capacityText"></div>

<div id="adminStatus" class="admin-status" style="display:none;">
관리자 모드 활성화됨
</div>

<hr>

<h2>제출 명단</h2>

<div id="list"></div>

<div id="adminControls" style="display:none;">

    <input type="number" id="totalPeople" placeholder="전체 인원 설정">

    <button onclick="setCapacity()">인원 설정</button>

    <button onclick="toggleDeadline()" class="btn-secondary">
        제출마감 토글
    </button>

    <button onclick="downloadReceiptsZip()" class="btn-secondary">
        ZIP 다운로드
    </button>

    <button onclick="openPwModal()" class="btn-secondary">
        비밀번호 변경
    </button>

    <button onclick="openResetModal()" class="btn-danger">
        전체 초기화
    </button>

</div>

</div>

<!-- 관리자 로그인 -->
<div class="modal" id="adminModal">
    <div class="modal-content">

        <h3>관리자 로그인</h3>

        <input type="password" id="adminPassword">

        <button onclick="checkAdminPassword()">로그인</button>

        <button onclick="closeAdminModal()" class="btn-secondary">
            취소
        </button>

    </div>
</div>

<!-- 비밀번호 변경 -->
<div class="modal" id="pwModal">
    <div class="modal-content">

        <h3>비밀번호 변경</h3>

        <input type="password" id="currentPw" placeholder="현재 비밀번호">

        <input type="password" id="newPw" placeholder="새 비밀번호">

        <button onclick="confirmChangePw()">변경하기</button>

        <button onclick="closePwModal()" class="btn-secondary">
            취소
        </button>

    </div>
</div>

<!-- 전체 초기화 -->
<div class="modal" id="resetModal">
    <div class="modal-content">

        <h3>전체 초기화</h3>

        <p style="font-size:12px;color:red;">
            정말 모든 데이터를 삭제하시겠습니까?
        </p>

        <input type="password" id="resetPassword" placeholder="관리자 비밀번호 확인">

        <button onclick="confirmReset()" class="btn-danger">
            삭제
        </button>

        <button onclick="closeResetModal()" class="btn-secondary">
            취소
        </button>

    </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB6ekDeGRtDKWfOIJkQ_PVt9peiVG25TyI",
  authDomain: "ulsan-breakfast.firebaseapp.com",
  projectId: "ulsan-breakfast",
  storageBucket: "ulsan-breakfast.firebasestorage.app",
  messagingSenderId: "880211242754",
  appId: "1:880211242754:web:2c5b14f8ed516919571c1b",
  databaseURL: "https://ulsan-breakfast-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let ADMIN_PASSWORD = "admin1234";

const ADMIN_TIMEOUT = 5 * 60 * 1000;

let isAdmin = false;
let adminTimer = null;
let isClosed = false;
let totalPeople = 0;
let currentData = [];

/* 실시간 데이터 감시 */
db.ref().on("value", (snapshot)=>{

    const allData = snapshot.val() || {};

    const breakfast = allData.breakfast || {};

    currentData = Object.values(breakfast);

    const settings = allData.settings || {};

    totalPeople = settings.totalPeople || 0;

    isClosed = settings.isClosed || false;

    if(settings.adminPassword){
        ADMIN_PASSWORD = settings.adminPassword;
    }

    updateDeadlineUI();
    updateCapacity();
    renderList();

});

/* 관리자 버튼 */
function toggleAdminByLock(){

    if(isAdmin){
        disableAdminMode();
    }else{
        openAdminModal();
    }
}

function openAdminModal(){
    document.getElementById("adminModal").style.display = "flex";
}

function closeAdminModal(){
    document.getElementById("adminModal").style.display = "none";
}

/* 제출 */
function submitData(){

    if(isClosed){
        alert("제출 마감됨");
        return;
    }

    const nameInput = document.getElementById("name");
    const amountInput = document.getElementById("amount");
    const receiptInput = document.getElementById("receipt");

    const name = nameInput.value.trim();
    const amount = amountInput.value.trim();
    const file = receiptInput.files[0];

    if(!name || !amount || !file){
        alert("이름, 금액, 파일 모두 입력해주세요.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        db.ref("breakfast").push({

            name:name,
            amount:amount,
            receipt:e.target.result,
            fileName:file.name,
            timestamp:Date.now()

        })
        .then(()=>{

            alert("제출 완료");

            nameInput.value = "";
            amountInput.value = "";
            receiptInput.value = "";

        })
        .catch((err)=>{

            console.error(err);

            alert("저장 실패");

        });

    };

    reader.readAsDataURL(file);
}

/* 명단 출력 */
function renderList(){

    const list = document.getElementById("list");

    list.innerHTML = "";

    const sorted = [...currentData]
    .sort((a,b)=>a.name.localeCompare(b.name,"ko"));

    sorted.forEach(item=>{

        const div = document.createElement("div");

        div.className = "entry";

        if(isAdmin){

            let preview = "";

            if(item.receipt.includes("application/pdf")){

                preview =
                `<div class="pdf-placeholder">
                    📄 PDF (${item.name})
                </div>`;

            }else{

                preview =
                `<img src="${item.receipt}">`;

            }

            div.innerHTML = `
                <b>${item.name}</b><br>
                ${item.amount}원<br>
                ${preview}
            `;

        }else{

            div.innerHTML = `<b>${item.name}</b>`;

        }

        list.appendChild(div);

    });
}

/* 인원 설정 */
function setCapacity(){

    const val = parseInt(
        document.getElementById("totalPeople").value
    );

    if(!val){
        return;
    }

    db.ref("settings/totalPeople").set(val);
}

function updateCapacity(){

    const submitted = currentData.length;

    document.getElementById("capacityText").innerText =
        totalPeople
        ? `${totalPeople - submitted}/${totalPeople}`
        : "";
}

/* 관리자 로그인 */
function checkAdminPassword(){

    const input = document.getElementById("adminPassword");

    if(input.value === ADMIN_PASSWORD){

        isAdmin = true;

        document.getElementById("adminControls").style.display = "block";

        document.getElementById("adminStatus").style.display = "block";

        closeAdminModal();

        renderList();

        clearTimeout(adminTimer);

        adminTimer = setTimeout(()=>{

            disableAdminMode();

        }, ADMIN_TIMEOUT);

    }else{

        alert("비밀번호 틀림");

    }

    input.value = "";
}

function disableAdminMode(){

    isAdmin = false;

    document.getElementById("adminControls").style.display = "none";

    document.getElementById("adminStatus").style.display = "none";

    renderList();
}

/* 제출 마감 */
function toggleDeadline(){

    db.ref("settings/isClosed").set(!isClosed);
}

function updateDeadlineUI(){

    const area = document.getElementById("submitArea");

    const box = document.getElementById("deadlineStatus");

    area.style.display = isClosed ? "none" : "block";

    box.innerHTML = isClosed
    ? `<div class="deadline-on">🚫 제출 마감 상태</div>`
    : "";
}

/* 비밀번호 변경 */
function openPwModal(){

    document.getElementById("pwModal").style.display = "flex";
}

function closePwModal(){

    document.getElementById("pwModal").style.display = "none";
}

function confirmChangePw(){

    const currentPw =
    document.getElementById("currentPw").value;

    const newPw =
    document.getElementById("newPw").value;

    if(currentPw !== ADMIN_PASSWORD){

        alert("현재 비밀번호가 틀렸습니다.");
        return;
    }

    if(!newPw || newPw.length < 4){

        alert("새 비밀번호를 4자리 이상 입력해주세요.");
        return;
    }

    db.ref("settings/adminPassword")
    .set(newPw)
    .then(()=>{

        ADMIN_PASSWORD = newPw;

        alert("비밀번호 변경 완료");

        document.getElementById("currentPw").value = "";
        document.getElementById("newPw").value = "";

        closePwModal();

    })
    .catch(()=>{

        alert("비밀번호 변경 실패");

    });
}

/* 전체 초기화 */
function openResetModal(){

    document.getElementById("resetModal").style.display = "flex";
}

function closeResetModal(){

    document.getElementById("resetModal").style.display = "none";
}

function confirmReset(){

    const pw =
    document.getElementById("resetPassword").value;

    if(pw !== ADMIN_PASSWORD){

        alert("비밀번호 틀림");
        return;
    }

    db.ref("breakfast")
    .remove()
    .then(()=>{

        alert("전체 삭제 완료");

        closeResetModal();

    })
    .catch(()=>{

        alert("삭제 실패");

    });
}

/* ZIP 다운로드 */
async function downloadReceiptsZip(){

    const zip = new JSZip();

    currentData.forEach((item,index)=>{

        if(item.receipt){

            const base64 =
            item.receipt.split(",")[1];

            const extension =
            item.fileName.split(".").pop();

            zip.file(
                `${item.name}_${index}.${extension}`,
                base64,
                {base64:true}
            );
        }

    });

    const content =
    await zip.generateAsync({type:"blob"});

    const a = document.createElement("a");

    a.href = URL.createObjectURL(content);

    a.download = "receipts.zip";

    a.click();
}

</script>

</body>
</html>
```
