<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>울산사업팀 조식비 제출</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    position:relative;
}

h1,h2{text-align:center;}

.lock-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    font-size:16px;
    opacity:0.6;
    cursor:pointer;
}

.lock-btn:hover{opacity:1;}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn-secondary{background:#6c757d;}
.btn-danger{background:#dc3545;}

.entry{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

img{
    max-width:200px;
    margin-top:10px;
    border-radius:6px;
}

.pdf-placeholder{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    background:#e9ecef;
    border-radius:6px;
    font-size:14px;
    color:#495057;
    border:1px dashed #ced4da;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
}

.admin-status{
    color:green;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.deadline-on{
    background:red;
    color:white;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.capacity{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<button class="lock-btn" onclick="toggleAdminByLock()">🔒</button>

<h1>울산사업팀 조식비 제출</h1>

<div id="submitArea">
    <input type="text" id="name" placeholder="이름 입력">
    <input type="text" id="amount" placeholder="금액 입력">
    <input type="file" id="receipt" accept="image/*,.pdf">
    <button onclick="submitData()">제출하기</button>
</div>

<div id="deadlineStatus"></div>

<div class="capacity" id="capacityText"></div>

<div id="adminStatus" class="admin-status" style="display:none;">
관리자 모드 활성화됨
</div>

<hr>

<h2>제출 명단</h2>
<div id="list"></div>

<div id="adminControls" style="display:none;">
    <input type="number" id="totalPeople" placeholder="전체 인원 설정">
    <button onclick="setCapacity()">인원 설정</button>
    <button onclick="toggleDeadline()" class="btn-secondary">제출마감</button>
    <button onclick="downloadReceiptsZip()" class="btn-secondary">ZIP 다운로드</button>
    <button onclick="openPwModal()" class="btn-secondary">비밀번호 변경</button>
    <button onclick="openResetModal()" class="btn-danger">전체 초기화</button>
</div>

</div>

<!-- 관리자 로그인 -->
<div class="modal" id="adminModal">
<div class="modal-content">
<h3>관리자 로그인</h3>
<input type="password" id="adminPassword">
<button onclick="checkAdminPassword()">로그인</button>
<button onclick="closeAdminModal()" class="btn-secondary">취소</button>
</div>
</div>

<!-- 비밀번호 변경 -->
<div class="modal" id="pwModal">
<div class="modal-content">
<h3>비밀번호 변경</h3>
<input type="password" id="currentPw" placeholder="현재 비밀번호">
<input type="password" id="newPw" placeholder="새 비밀번호">
<button onclick="confirmChangePw()">변경</button>
<button onclick="closePwModal()" class="btn-secondary">취소</button>
</div>
</div>

<!-- 초기화 -->
<div class="modal" id="resetModal">
<div class="modal-content">
<h3>전체 초기화</h3>
<input type="password" id="resetPassword" placeholder="비밀번호">
<button onclick="confirmReset()" class="btn-danger">삭제</button>
<button onclick="closeResetModal()" class="btn-secondary">취소</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6ekDeGRtDKWfOIJkQ_PVt9peiVG25TyI",
  authDomain: "ulsan-breakfast.firebaseapp.com",
  projectId: "ulsan-breakfast",
  databaseURL: "https://ulsan-breakfast-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let ADMIN_PASSWORD = "admin1234";
let isAdmin = false;
let isClosed = false;
let totalPeople = 0;
let currentData = [];

/* realtime */
db.ref().on("value", (snapshot)=>{
    const all = snapshot.val() || {};
    const breakfast = all.breakfast || {};
    const settings = all.settings || {};

    currentData = Object.values(breakfast);
    totalPeople = settings.totalPeople || 0;
    isClosed = settings.isClosed || false;
    ADMIN_PASSWORD = settings.adminPassword || "admin1234";

    updateDeadlineUI();
    updateCapacity();
    renderList();
});

/* submit (🔥 수정된 부분) */
function submitData(){
    if(isClosed) return alert("마감됨");

    const name = document.getElementById("name").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const file = document.getElementById("receipt").files[0];

    if(!name || !amount || !file) return alert("입력 필요");

    const reader = new FileReader();
    reader.onload = e=>{
        db.ref("breakfast").push({
            name,
            amount,
            receipt: e.target.result,
            fileName: file.name,
            timestamp: Date.now()
        });

        // 🔥 입력값 초기화
        document.getElementById("name").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("receipt").value = "";

        // 🔥 버튼 상태 변경
        const btn = document.querySelector("#submitArea button");
        const origin = btn.innerText;

        btn.innerText = "제출되었습니다";
        btn.style.background = "#28a745";

        setTimeout(()=>{
            btn.innerText = origin;
            btn.style.background = "#007bff";
        }, 1500);
    };

    reader.readAsDataURL(file);
}

/* render */
function renderList(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    const sorted = [...currentData].sort((a,b)=>
        a.name.localeCompare(b.name,"ko")
    );

    sorted.forEach(item=>{
        const div = document.createElement("div");
        div.className="entry";

        if(isAdmin){
            const preview = item.receipt.includes("pdf")
                ? `<div class="pdf-placeholder">📄 PDF</div>`
                : `<img src="${item.receipt}">`;

            div.innerHTML = `
                <b>${item.name}</b><br>
                ${item.amount}원<br>
                ${preview}
            `;
        } else {
            div.innerHTML = `<b>${item.name}</b>`;
        }

        list.appendChild(div);
    });
}

/* admin */
function toggleAdminByLock(){
    isAdmin ? disableAdminMode() : openAdminModal();
}

function openAdminModal(){
    document.getElementById("adminModal").style.display="flex";
}

function closeAdminModal(){
    document.getElementById("adminModal").style.display="none";
}

function checkAdminPassword(){
    const v = document.getElementById("adminPassword").value;

    if(v === ADMIN_PASSWORD){
        isAdmin = true;
        document.getElementById("adminControls").style.display="block";
        document.getElementById("adminStatus").style.display="block";
        closeAdminModal();
        renderList();
    } else {
        alert("비번 틀림");
    }

    document.getElementById("adminPassword").value="";
}

function disableAdminMode(){
    isAdmin = false;
    document.getElementById("adminControls").style.display="none";
    document.getElementById("adminStatus").style.display="none";
    renderList();
}

/* capacity */
function setCapacity(){
    const v = parseInt(document.getElementById("totalPeople").value);
    if(v) db.ref("settings/totalPeople").set(v);
}

function updateCapacity(){
    const submitted = currentData.length;
    document.getElementById("capacityText").innerText =
        totalPeople ? `${totalPeople-submitted}/${totalPeople}` : "";
}

/* deadline */
function toggleDeadline(){
    db.ref("settings/isClosed").set(!isClosed);
}

function updateDeadlineUI(){
    document.getElementById("submitArea").style.display =
        isClosed ? "none" : "block";

    document.getElementById("deadlineStatus").innerHTML =
        isClosed ? `<div class="deadline-on">🚫 마감</div>` : "";
}

/* pw */
function openPwModal(){pwModal.style.display="flex";}

function closePwModal(){
    document.getElementById("pwModal").style.display="none";
    document.getElementById("currentPw").value="";
    document.getElementById("newPw").value="";
}

function confirmChangePw(){
    const cur = currentPw.value;
    const next = newPw.value;

    if(cur !== ADMIN_PASSWORD) return alert("틀림");
    if(next.length < 4) return alert("4자리 이상");

    db.ref("settings").update({adminPassword: next});
    ADMIN_PASSWORD = next;
    closePwModal();
}

/* reset */
function openResetModal(){resetModal.style.display="flex";}

function closeResetModal(){
    document.getElementById("resetModal").style.display="none";
    document.getElementById("resetPassword").value="";
}

function confirmReset(){
    if(resetPassword.value !== ADMIN_PASSWORD)
        return alert("틀림");

    db.ref("breakfast").remove();
}

/* ZIP */
async function downloadReceiptsZip(){
    const zip = new JSZip();
    const month = new Date().getMonth()+1;

    currentData.forEach(item=>{
        if(!item.receipt) return;

        const base64 = item.receipt.split(",")[1];
        const ext = item.fileName.split(".").pop();

        const safeName = item.name.replace(/[\\/:*?"<>|]/g, "");

        zip.file(
            `${month}월 조식 ${safeName}.${ext}`,
            base64,
            { base64:true }
        );
    });

    const blob = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${month}월_조식.zip`;
    a.click();
}
</script>

</body>
</html>
